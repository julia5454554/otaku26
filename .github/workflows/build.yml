name: Build and Publish Extensions

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Fix Formatting (Spotless)
        run: ./gradlew spotlessApply

      - name: Commit Formatting Fixes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-fix spotless formatting [skip ci]" || echo "Nada para commitar"
          git push

      - name: Build APKs
        run: ./gradlew assembleDebug

      - name: Collect APKs
        run: |
          mkdir -p apk
          find . -name "*.apk" -exec cp {} apk/ \;

      - name: Generate index.min.json
        run: |
          cat << 'EOF' > generate_index.py
          import glob, json, os, re, subprocess

          aapt = sorted(glob.glob(os.environ["ANDROID_HOME"] + "/build-tools/*/aapt"))[-1]
          out = []

          for apk in sorted(glob.glob("apk/*.apk")):
              info = subprocess.check_output([aapt, "dump", "badging", apk], text=True)
              pkg = re.search(r"package: name='([^']+)'", info).group(1)
              code = int(re.search(r"versionCode='(\d+)'", info).group(1))
              ver = re.search(r"versionName='([^']+)'", info).group(1)
              label = re.search(r"application-label:'([^']+)'", info).group(1)
              nsfw = re.search(r"extension\.nsfw' value='(?:\(type [^)]*\))?(?:0x)?(\d)'", info)
              lang = os.path.basename(apk).split("-")[1].split(".")[0]
              out.append({
                  "name": label,
                  "pkg": pkg,
                  "apk": os.path.basename(apk),
                  "lang": lang,
                  "code": code,
                  "version": ver,
                  "nsfw": int(nsfw.group(1)) if nsfw else 0,
                  "sources": [],
              })

          with open("index.min.json", "w") as f:
              json.dump(out, f, separators=(",", ":"))
          EOF
          python generate_index.py

      - name: Generate repo.json
        run: |
          APK=$(ls apk/*.apk | head -n1)
          FP=$(keytool -printcert -jarfile "$APK" | grep 'SHA256:' | head -1 | awk '{print $2}' | tr -d ':' | tr 'A-F' 'a-f')
          echo "{\"meta\":{\"name\":\"Otaku26\",\"shortName\":\"Otaku26\",\"website\":\"https://github.com/julia54545454/otaku26\",\"signingKeyFingerprint\":\"$FP\"}}" > repo.json
          cat repo.json

      - name: Push to repo branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b repo
          git add -f apk/ index.min.json repo.json
          git commit -m "Auto-generating index.min.json and repo.json [skip ci]" || echo "Nada para commitar"
          git push -f origin repo
